<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor & Saber — Cardápio</title>

  <!-- Bootstrap 5.3 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Nosso CSS custom (fica DEPOIS pra sobrescrever quando necessário) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header: bg-danger (vermelho), texto branco, centralizado, padding vertical -->
  <header class="bg-danger text-white text-center py-4 mb-4">
    <h1 class="fw-bold">Sabor & Saber</h1>
    <p class="mb-0 fs-5">Sabor de casa. Preço justo.</p>
  </header>

  <!-- Container do Bootstrap centraliza e limita largura máxima -->
  <main class="container">

    <h2 class="text-center mb-4">Nosso Cardápio</h2>

    <!-- Row: linha do grid.
         Cada article vira uma coluna:
         - col-12  → mobile: 1 card por linha
         - col-md-6 → tablet: 2 cards por linha
         - col-lg-4 → desktop: 3 cards por linha  -->
    <section id="cardapio" class="row g-3">
      <!-- Cards renderizados dinamicamente via script.js -->
    </section>

  </main>

  <!-- Footer: centralizado, texto discreto -->
  <footer class="text-center text-muted py-4 mt-5">
    <small>Feito com HTML + CSS + JS + Bootstrap 5 · Sabor & Saber</small>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
