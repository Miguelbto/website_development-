<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador Bootstrap — Grid + Utilities</title>

  <!-- Bootstrap 5.3 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <main class="container py-4">

    <h1 class="text-center fw-bold mb-2">🎨 Explorador Bootstrap</h1>
    <p class="text-center text-muted mb-5">Clique nos botões para ver cada conceito acontecendo ao vivo</p>

    <div class="row g-3">

      <!-- ===== PAINEL 1: Botões ===== -->
      <aside class="col-12 col-lg-4">
        <div class="bg-white p-4 rounded-3 shadow-sm">
          <h2 class="fs-5 fw-bold text-danger mb-3 pb-2 border-bottom">⚙️ Conceitos</h2>

          <div class="mb-3">
            <h6 class="text-muted small text-uppercase">Grid System</h6>
            <button class="btn btn-danger w-100 text-start mb-2" onclick="demoGrid('6-6')">1️⃣ Grid — Duas colunas (col-6 + col-6)</button>
            <button class="btn btn-danger w-100 text-start mb-2" onclick="demoGrid('4-4-4')">2️⃣ Grid — Três colunas (col-4 × 3)</button>
            <button class="btn btn-danger w-100 text-start mb-2" onclick="demoGrid('responsivo')">3️⃣ Grid — Responsivo (mobile/desktop)</button>
          </div>

          <div class="mb-3">
            <h6 class="text-muted small text-uppercase">Utilities</h6>
            <button class="btn btn-danger w-100 text-start mb-2" onclick="demoSpacing()">4️⃣ Spacing (margin, padding)</button>
            <button class="btn btn-danger w-100 text-start mb-2" onclick="demoText()">5️⃣ Text (align, weight, size)</button>
            <button class="btn btn-danger w-100 text-start mb-2" onclick="demoColors()">6️⃣ Colors (bg, text, border)</button>
            <button class="btn btn-danger w-100 text-start mb-2" onclick="demoDisplay()">7️⃣ Display (flex, hidden)</button>
          </div>

          <button class="btn btn-secondary w-100" onclick="resetar()">🔄 Resetar tudo</button>
        </div>
      </aside>

      <!-- ===== PAINEL 2: Visualização ===== -->
      <section class="col-12 col-lg-8">
        <div class="bg-white p-4 rounded-3 shadow-sm">
          <h2 class="fs-5 fw-bold text-danger mb-3 pb-2 border-bottom">🖼️ Resultado ao vivo</h2>

          <div id="visual" class="bg-light rounded-3 p-3 mb-3" style="min-height: 200px;">
            <em class="text-muted">Clique num botão pra ver o efeito.</em>
          </div>

          <h3 class="fs-6 fw-bold text-muted mb-2">Código HTML aplicado:</h3>
          <pre id="codigo" class="bg-dark text-white p-3 rounded-3 mb-0"><code class="text-white-50">// nada ainda</code></pre>
        </div>
      </section>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
