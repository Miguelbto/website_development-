<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFood — Sabor & Saber</title>

  <!-- Bootstrap 5.3 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <nav class="navbar navbar-expand-lg bg-danger navbar-dark">
        <div class="container">
          <a class="navbar-brand fw-bold" href="#">Sabor & Saber</a>
          <button 
          class="navbar-toggler" 
          data-bs-toggle="collapse" 
          data-bs-target="#menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#cardapio">Cardápio</a></li>
              <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
            </ul>
          </div>
        </div>
      </nav>

  <main class="container my-5">

    <h2 class="text-center mb-4">Nosso Cardápio</h2>
    <section id="cardapio" class="row g-3">
    </section>

    <hr class="my-5">

    <section id="contato" class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <h2 class="text-center mb-4">Fale conosco</h2>
        <form action="">
          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control"
            id="nome"
            placeholder="Seu nome completo"
            required>
          </div>

          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" 
            class="form-control" 
            id="email"
            placeholder="nome@exemplo@email.com"
            required>
          </div class="mb-3"><div>
            <label class="form-label">Mensagem</label>
            <input type="text" 
            class="form-control"
            id="mensagem"
            placeholder="Sua mensagem aqui"
          >
          </div>
          
           <button type="button" class="btn btn-danger w-100">Enviar mensagem</button>
        </form>
      </div>
    </section>

  </main>
  

  <div class="modal fade" id="modalPrato" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="modalNome">Nome do prato</h5>
            <button type="button" class="btn-close btn-close-white"
                    data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="modalCategoria" class="text-muted"></p>
            <p id="modalPreco" class="fs-4 fw-bold text-success"></p>
          </div>
          <div class="modal-footer">
            <button class="btn btn-danger w-100">Pedir Agora</button>
          </div>
        </div>
      </div>
    </div>

  
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 

  <script src="script.js" defer></script>
</body>
</html>
