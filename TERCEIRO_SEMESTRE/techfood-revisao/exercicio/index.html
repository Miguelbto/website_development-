<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabarito — Exercícios do Kickoff (Bebidas)</title>
  <link rel="stylesheet" href="src/styles/styles.css">
</head>
<body>
  <header class="topo">
    <h1>Bebidas do Sabor &amp; Saber</h1>
    <p>Gabarito dos 5 exercícios</p>
  </header>

  <main>
    <!-- Exercício 5 pede um filtro. O input controla o filtro em tempo real. -->
    <div class="filtro-wrap">
      <input
        type="text"
        id="filtro"
        placeholder="🔍 Digite para filtrar por nome (ex.: coca, suco...)"
      >
    </div>

    <!-- Container onde os cards das bebidas serão renderizados dinamicamente. -->
    <section id="lista-bebidas" class="lista-bebidas"></section>
  </main>

  <footer>
    <small>Gabarito · Prof. Marlon · Turma 2B</small>
  </footer>

  <script src="src/scripts/script.js" defer></script>
</body>
</html>
